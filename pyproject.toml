[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-digest"
version = "0.1.0"
description = "Local MCP server that collects AI coding agent sessions into a daily digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
daily-digest-mcp = "daily_digest.mcp_server:main"

[tool.setuptools.packages.find]
include = ["daily_digest*"]
